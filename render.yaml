services:
  # ─── Backend: FastAPI ───────────────────────────────────────────────────────
  - type: web
    name: raati-ai-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: OPENAI_API_KEY
        sync: false          # Enter manually in Render dashboard
      - key: XAI_API_KEY
        sync: false
      - key: CLAUDE_API_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false          # Set to your frontend Render URL, e.g. https://raati-ai-frontend.onrender.com
      - key: PYTHON_VERSION
        value: 3.12.0
    disk:
      name: raati-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1              # Persistent disk for uploaded images & results

  # ─── Frontend: Vite + React (Static Site) ──────────────────────────────────
  - type: web
    name: raati-ai-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false          # Set to your backend Render URL, e.g. https://raati-ai-backend.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html   # Required for React Router client-side routing
